<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>LYBS Sponsor Info</title>
<meta name="theme-color" content="#0a1628">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body class="intake">
<!-- Public page for paid sponsors, opened from the link in their receipt
     (?t=...). It shows that one sponsor's level and takes their info. -->
<main class="intake-main">
  <header class="intake-head">
    <img src="logo.svg" alt="Lunenburg Youth Baseball & Softball" class="signin-logo">
    <h1>Sponsor <span class="accent">Info</span></h1>
    <p id="greet" class="hint">Loading your sponsorship…</p>
  </header>

  <section id="levels" class="form hidden" aria-label="Your sponsorship level">
    <h2>Your sponsorship</h2>
    <ul id="levelList" class="lv-list"></ul>
    <p id="pending" class="lv-note hidden"></p>
  </section>

  <section id="payBox" class="form lv-pay hidden" aria-live="polite"></section>

  <form id="pageForm" class="form hidden" novalidate>
    <p id="formFor" class="lv-for"></p>
    <fieldset>
      <legend>Your contact</legend>
      <label>Your name <span class="req">*</span>
        <input id="contactName" type="text" autocomplete="name" required maxlength="200">
      </label>
      <label>Email <span class="req">*</span>
        <input id="contactEmail" type="email" autocomplete="email" required maxlength="200">
      </label>
      <label>Phone
        <input id="contactPhone" type="tel" autocomplete="tel" maxlength="60">
      </label>
    </fieldset>

    <fieldset>
      <legend>Your sponsor listing</legend>
      <label>Business name as it should show on our website
        <input id="business" type="text" maxlength="200">
      </label>
      <label data-need="jersey">Name on the jersey <span class="req">*</span>
        <input id="jerseyName" type="text" maxlength="120">
      </label>
      <label>Website
        <input id="website" type="url" inputmode="url" placeholder="https://" maxlength="300">
      </label>
      <label>Facebook page
        <input id="facebook" type="text" maxlength="300" placeholder="So we can tag you">
      </label>
      <label>Instagram
        <input id="instagram" type="text" maxlength="300" placeholder="@yourbusiness">
      </label>
      <label>Other social
        <input id="otherSocial" type="text" maxlength="300">
      </label>
      <label data-need="writeup">Sponsor write-up
        <textarea id="writeup" rows="4" placeholder="A short description of your business for our website and social posts."></textarea>
        <small><span id="writeupCount">0</span> / <span id="writeupMax">0</span> characters</small>
      </label>
      <label>Sponsoring a player, team or division?
        <input id="sponsoring" type="text" maxlength="200" placeholder="Optional">
      </label>
      <label data-need="logo">Logo <span class="req">*</span>
        <input id="logoFile" type="file" accept=".png,.jpg,.jpeg,.svg,.ai,.eps,.pdf,.psd,.tif,.tiff,image/*,application/pdf">
        <small>High resolution: PNG, SVG, AI, EPS, PDF or JPG. Up to 15 MB.</small>
      </label>
    </fieldset>

    <fieldset data-need="banner">
      <legend>Your 3x5 vinyl banner</legend>
      <p class="hint">It hangs along the fence at Marshall Park all season.</p>
      <label>What should we do for your banner? <span class="req">*</span>
        <select id="bannerChoice">
          <option value="">Choose one…</option>
          <option>Reuse our banner from last season</option>
          <option>I'm attaching a new print-ready design</option>
          <option>Please design one using our logo</option>
        </select>
      </label>
      <label id="designWrap" class="hidden">Banner design file
        <input id="designFile" type="file" accept=".png,.jpg,.jpeg,.svg,.ai,.eps,.pdf,.psd,.tif,.tiff,image/*,application/pdf">
        <small>3 ft x 5 ft. PDF, AI or EPS print best. Up to 15 MB.</small>
      </label>
      <label id="bannerTextWrap" class="hidden">Wording, colors or anything we should know
        <textarea id="bannerText" rows="3" maxlength="600" placeholder="e.g. phone number and website under the logo, white background"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>Anything else</legend>
      <label>Files too big? Paste a share link
        <input id="fileLink" type="url" inputmode="url" placeholder="Google Drive, Dropbox or WeTransfer link" maxlength="500">
      </label>
      <label>Anything else we should know
        <textarea id="more" rows="2" maxlength="1000"></textarea>
      </label>
    </fieldset>

    <button type="submit" class="btn primary" id="sendBtn">Send to LYBS</button>
    <p id="formMsg" class="status" role="alert"></p>
  </form>

  <section id="done" class="form hidden">
    <h2>Thank you!</h2>
    <p id="doneText">We have your info. If we need anything else, we'll reach out by email.</p>
  </section>
</main>
<script src="config.js"></script>
<script src="sponsor-page.js"></script>
</body>
</html>
